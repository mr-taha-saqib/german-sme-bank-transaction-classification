name: CI

on:
  pull_request:
  push:
    branches: [main, mlops-production-delivery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  research-verification:
    name: Research integrity (no deep-learning stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install numpy==2.5.2 pandas==3.0.5 scikit-learn==1.9.0 scipy==1.18.1 openpyxl==3.1.5 matplotlib==3.11.1
      - name: Frozen split (19 checks)
        run: python verify_dataset.py
      - name: Augmentation corpus v2 (11 checks)
        run: python verify_augmentation.py
      - name: Final results integrity + traceability from saved logits
        run: python final_evaluation.py

  lint-and-test:
    name: Lint + unit / API / integration tests (CPU, tiny test model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install CPU PyTorch + dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -r requirements-dev.txt
      - name: Lint (ruff, MLOps layer)
        run: ruff check .
      - name: Tests (no model download; tiny BERT built offline)
        run: >
          pytest --junitxml=reports/junit.xml
          --cov=src --cov-report=xml:reports/coverage.xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/

  docker:
    name: Docker build + container smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Build API image
        run: docker build --target base -t txclf-api:ci .
      - name: Build a TINY demo model (not GermanFinBERT)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -r requirements-mlops.txt
          python scripts/build_demo_model.py --registry ci-registry
          chmod -R a+rX ci-registry
      - name: Start container
        run: |
          docker run -d --name txclf -p 8000:8000 -v "$PWD/ci-registry:/app/model_registry:ro" txclf-api:ci
          for i in $(seq 1 45); do
            s=$(docker inspect -f '{{.State.Health.Status}}' txclf); echo "health: $s"
            [ "$s" = "healthy" ] && break; sleep 3
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' txclf)" = "healthy" ]
      - name: Inference inside the container
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/predict -H 'content-type: application/json' \
            -d '{"description": "Gehaltslauf 2026-01"}' | tee pred.json
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/predict \
            -H 'content-type: application/json' -d '{"description": ""}')
          test "$code" = "422"
          python -c "import json; d=json.load(open('pred.json')); assert d['decision'] in ('automatic','manual_review'); print('OK', d['category'], d['confidence'])"
      - name: Container logs
        if: always()
        run: docker logs txclf
      - name: Stop container
        if: always()
        run: docker rm -f txclf
